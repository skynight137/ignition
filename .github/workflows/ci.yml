# CI for skynight137/ignition — modeled on the user-provided matrix example:
# OS matrix, fail-fast: false, concurrency cancel-in-progress, artifacts
# uploaded even on failure. Node is pinned to 26 (the fleet's major).
#
# Jobs:
#   changes         decides the scope of this run. On pull requests it maps
#                   the changed files to the tool lanes they can affect
#                   (dorny/paths-filter); shared setup machinery, the CI
#                   file itself, or any non-PR event selects the FULL
#                   matrix. Full runs therefore still gate every push to
#                   main, and a weekly scheduled run sweeps the whole
#                   matrix regardless of what changed.
#   payload-checks  syntax + discovery + cited-path audit, 3 OSes. Always.
#   xdg-absent      setup.sh --help with every XDG var unset — the
#                   "terkadang XDG tidak ada dan menyebabkan bugs" class.
#                   Runs when shared machinery changed (or full runs).
#   tomlkit-provision
#                   fresh-box case: no tomlkit python and no uv on the
#                   runner — setup must provision both itself so the
#                   REPLIT_BASHRC pin lands (tests/tomlkit-provision.sh).
#                   Same gating as xdg-absent.
#   tool-setups     per-tool install tests: each setup.sh lane installs
#                   into an isolated root and must pass setup's own
#                   --doctor line for that tool ("installed AND runs").
#                   Ubuntu covers every lane; macOS covers the lanes
#                   whose upstreams are cross-platform. Windows gets
#                   no install legs — the lanes target unix layout and
#                   binaries; its coverage is the payload checks.
#                   Excluded: --join (needs a live tailnet auth key; its
#                   install half is the tailscale leg), --zsh (Nix
#                   profile lane, not a direct-binary install), and the
#                   tailscale lane on macOS (upstream publishes no
#                   user-local darwin build — the .pkg is system-wide).
#                   Each leg restores its isolated root from an exact-key
#                   cache (key covers every file under scripts/setup/), so
#                   unchanged lanes skip the upstream downloads entirely —
#                   the downloads are the flaky part (CDN 504s), the
#                   install+doctor verification still runs every time
#                   against the restored tree whenever setup finds work
#                   to do, and any setup change busts every key.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full-matrix sweep (Mondays 05:17 UTC), independent of the
    # change-scoped PR runs.
    - cron: '17 5 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      shared: ${{ steps.scope.outputs.shared }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'scripts/setup.sh'
              - 'scripts/setup/core.sh'
              - 'scripts/setup/common.sh'
              - 'scripts/setup/rc.sh'
              - 'scripts/setup/cli.sh'
              - 'scripts/setup/root.sh'
              - 'scripts/setup/cleanup.sh'
              - 'scripts/setup/doctor.sh'
              - 'scripts/setup/fix.sh'
              - 'scripts/setup/ui_menu.sh'
              - 'scripts/setup/bin.sh'
              - 'scripts/setup/profile-*.sh'
              - 'scripts/setup/join.sh'
              - 'scripts/setup/join-repl.sh'
              - 'scripts/setup/hermes_chromium.sh'
              - 'tests/tool-setup.sh'
            ci:
              - '.github/workflows/ci.yml'
            tomlkit:
              - 'tests/tomlkit-provision.sh'
            uv:
              - 'scripts/setup/uv.sh'
            node_opencode:
              - 'scripts/setup/node_opencode.sh'
            expose:
              - 'scripts/setup/expose.sh'
            download:
              - 'scripts/setup/download.sh'
            camofox:
              - 'scripts/setup/camofox.sh'
            moli:
              - 'scripts/setup/moli.sh'
            lightpanda:
              - 'scripts/setup/lightpanda.sh'
            llmwiki:
              - 'scripts/setup/llm-wiki.sh'
              - 'scripts/setup/llm-wiki/**'
            android:
              - 'scripts/setup/android.sh'
              - 'scripts/setup/java.sh'
            java:
              - 'scripts/setup/java.sh'

      # The lane list lives here exactly once; tool-setups consumes it as
      # a dynamic matrix. Lane -> file mapping follows the setup tree:
      # node_opencode.sh installs node/opencode/ollama/claude/ori (and is
      # the closest owner of the hermes lane), expose.sh installs
      # cloudflared/tailscale/sshx, download.sh installs
      # rclone/qbt/aria2/ffmpeg, the rest are one file per lane.
      # scripts/setup/zsh.sh is deliberately unmapped: the zsh lane has
      # no CI leg (see header), its syntax is covered by payload-checks.
      - name: Compute lane matrix for this run
        id: scope
        run: |
          set -euo pipefail
          lane() { printf '{"tool":"%s","flag":"%s","label":"%s","os":"%s"}\n' "$1" "$2" "$3" "$4"; }
          all_lanes() {
            lane uv --uv "uv:" ubuntu-latest
            lane node --node "Node:" ubuntu-latest
            lane opencode --opencode "OpenCode:" ubuntu-latest
            lane ollama --ollama "Ollama:" ubuntu-latest
            lane claude --claude "Claude:" ubuntu-latest
            lane hermes --hermes "Hermes:" ubuntu-latest
            lane ori --openrouterai "ORI:" ubuntu-latest
            lane rclone --rclone "rclone:" ubuntu-latest
            lane qbt --qbt "qBittorrent-nox:" ubuntu-latest
            lane aria2 --aria2 "aria2c:" ubuntu-latest
            lane ffmpeg --ffmpeg "FFmpeg:" ubuntu-latest
            lane cloudflared --cloudflared "cloudflared:" ubuntu-latest
            lane tailscale --tailscale "tailscale:" ubuntu-latest
            lane sshx --sshx "sshx:" ubuntu-latest
            lane lightpanda --lightpanda "Lightpanda:" ubuntu-latest
            lane llm-wiki --llm-wiki "llm-wiki:" ubuntu-latest
            lane camofox --camofox "Camofox:" ubuntu-latest
            lane moli --moli "Moli:" ubuntu-latest
            lane android --android-tools "Android SDK (adb):" ubuntu-latest
            lane java --java "Java:" ubuntu-latest
            lane uv --uv "uv:" macos-latest
            lane node --node "Node:" macos-latest
            lane rclone --rclone "rclone:" macos-latest
            lane cloudflared --cloudflared "cloudflared:" macos-latest
          }
          sel_lanes() {
            if [ "${{ steps.filter.outputs.uv }}" = "true" ]; then
              lane uv --uv "uv:" ubuntu-latest
              lane uv --uv "uv:" macos-latest
            fi
            if [ "${{ steps.filter.outputs.node_opencode }}" = "true" ]; then
              lane node --node "Node:" ubuntu-latest
              lane node --node "Node:" macos-latest
              lane opencode --opencode "OpenCode:" ubuntu-latest
              lane ollama --ollama "Ollama:" ubuntu-latest
              lane claude --claude "Claude:" ubuntu-latest
              lane hermes --hermes "Hermes:" ubuntu-latest
              lane ori --openrouterai "ORI:" ubuntu-latest
            fi
            if [ "${{ steps.filter.outputs.expose }}" = "true" ]; then
              lane cloudflared --cloudflared "cloudflared:" ubuntu-latest
              lane cloudflared --cloudflared "cloudflared:" macos-latest
              lane tailscale --tailscale "tailscale:" ubuntu-latest
              lane sshx --sshx "sshx:" ubuntu-latest
            fi
            if [ "${{ steps.filter.outputs.download }}" = "true" ]; then
              lane rclone --rclone "rclone:" ubuntu-latest
              lane rclone --rclone "rclone:" macos-latest
              lane qbt --qbt "qBittorrent-nox:" ubuntu-latest
              lane aria2 --aria2 "aria2c:" ubuntu-latest
              lane ffmpeg --ffmpeg "FFmpeg:" ubuntu-latest
            fi
            if [ "${{ steps.filter.outputs.camofox }}" = "true" ]; then
              lane camofox --camofox "Camofox:" ubuntu-latest
            fi
            if [ "${{ steps.filter.outputs.moli }}" = "true" ]; then
              lane moli --moli "Moli:" ubuntu-latest
            fi
            if [ "${{ steps.filter.outputs.lightpanda }}" = "true" ]; then
              lane lightpanda --lightpanda "Lightpanda:" ubuntu-latest
            fi
            if [ "${{ steps.filter.outputs.llmwiki }}" = "true" ]; then
              lane llm-wiki --llm-wiki "llm-wiki:" ubuntu-latest
            fi
            if [ "${{ steps.filter.outputs.android }}" = "true" ]; then
              lane android --android-tools "Android SDK (adb):" ubuntu-latest
            fi
            if [ "${{ steps.filter.outputs.java }}" = "true" ]; then
              lane java --java "Java:" ubuntu-latest
            fi
          }
          FULL=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then FULL=true; fi
          if [ "${{ steps.filter.outputs.ci }}" = "true" ]; then FULL=true; fi
          if [ "${{ steps.filter.outputs.shared }}" = "true" ]; then FULL=true; fi
          if [ "$FULL" = "true" ]; then INC=$(all_lanes); else INC=$(sel_lanes); fi
          if [ -n "$INC" ]; then
            MATRIX=$(printf '%s\n' "$INC" | jq -s -c '{include: .}')
          else
            MATRIX='{"include":[]}'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          SHARED=false
          if [ "$FULL" = "true" ]; then SHARED=true; fi
          if [ "${{ steps.filter.outputs.tomlkit }}" = "true" ]; then SHARED=true; fi
          echo "shared=$SHARED" >> "$GITHUB_OUTPUT"
          echo "scope: full=$FULL shared=$SHARED lanes=$(printf '%s' "$MATRIX" | jq '.include | length')"

  payload-checks:
    name: Payloads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false # one OS failing must not stop the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax (all payload scripts)
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }; done \
            < <(find scripts tests -name '*.sh' -type f)
          exit $fail

      - name: Python compile (cache outside the tree)
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python3 -m py_compile scripts/*.py scripts/replit/*.py scripts/muse/*.py

      - name: Beacon backlog regression (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash tests/tsbeacon-backlog.sh

      # Skill discovery + cited-path audit lived here in the skills repo;
      # they audit SKILL.md content, which does not live in this repo
      # (machinery only). Parked with the split, 2026-11-11.

  xdg-absent:
    name: XDG-absent smoke (ubuntu)
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The bug class the user flagged: code that reads ambient XDG vars
      # bare breaks or writes outside the tree when they are unset (some
      # runners, some shells). The setup lanes under scripts/setup/
      # are exempt by construction — setup.sh's preamble defines every
      # XDG_* var before sourcing them — so this job checks the surfaces
      # that face the raw environment:
      # 1. Behavioral: replit setup --help with every XDG var unset must
      #    still work (its preamble re-derives them itself).
      - name: replit setup --help with XDG unset
        # SETUP_ROOT stands in for the platform workspace a real box
        # provides (REPL_HOME); without it setup cannot determine its
        # install root and exits before the XDG derivation even runs —
        # that is what the first CI run proved. The XDG vars stay unset:
        # re-deriving them is the behaviour under test.
        env:
          SETUP_ROOT: ${{ runner.temp }}/ws
        run: |
          mkdir -p "$SETUP_ROOT"
          env -u XDG_DATA_HOME -u XDG_STATE_HOME -u XDG_CONFIG_HOME \
              -u XDG_CACHE_HOME -u XDG_BIN_HOME \
            timeout 60 bash scripts/setup.sh --machine repl --help </dev/null >/dev/null

      # 2. Python payloads must never hard-subscript an XDG var
      #    (os.environ["XDG_..."] crashes when it is unset).
      - name: No hard XDG subscripts in python payloads
        run: |
          if grep -rnE 'environ\\[.(XDG_[A-Z_]+)' scripts/ --include='*.py'; then
            echo "hard XDG subscript found"; exit 1
          fi
          echo "python XDG reads all guarded"

      # 3. Standalone shell entry points: no bare unguarded reads of the
      #    ambient XDG homes.
      - name: No unguarded XDG reads in standalone shell entry points
        run: |
          files="scripts/muse/setup.sh scripts/tour.sh scripts/replit/join-lifecycle-test.sh"
          if grep -nE '\\$XDG_(DATA|STATE|CONFIG|CACHE)_HOME' $files \
               | grep -vE ':[0-9]+:\\s*#' \
               | grep -vE '\\$\\{XDG_[A-Z_]+:-' \
               | grep -vE 'XDG_[A-Z_]+=' ; then
            echo "Unguarded XDG reads found (see above)"; exit 1
          fi
          echo "standalone XDG reads guarded"

  tomlkit-provision:
    name: tomlkit provisioning (ubuntu)
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The runner IS the fresh-box case: its python3 has no tomlkit and
      # uv is not installed, so setup must provision both itself for the
      # REPLIT_BASHRC pin to land. tests/tomlkit-provision.sh asserts on
      # the pin + the doctor `toml python:` line + idempotency.
      - name: setup provisions tomlkit; REPLIT_BASHRC pin lands
        env:
          SETUP_ROOT: ${{ runner.temp }}/ws-tomlkit
        run: bash tests/tomlkit-provision.sh

  tool-setups:
    name: Tool setup (${{ matrix.tool }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false # one tool failing must not stop the others
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The payloads need bash >= 4 (associative arrays); a stock Mac
      # ships bash 3.2, so the macOS legs run under Homebrew's bash —
      # the same remedy setup.sh's own version guard prescribes.
      - name: Install modern bash (macOS legs)
        if: matrix.os == 'macos-latest'
        run: brew install bash

      # Exact-key only (no restore-keys): the key covers every file
      # under scripts/setup/, so any setup change — pin or code — busts
      # the cache and the lane installs fresh; an unchanged lane
      # restores its isolated root and setup's own present-checks +
      # doctor verification decide the verdict.
      - name: Restore isolated install root (cache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ws-${{ matrix.tool }}
          key: toolsetup-v1-${{ matrix.os }}-${{ matrix.tool }}-${{ hashFiles('scripts/setup/**') }}

      - name: Install ${{ matrix.tool }} into an isolated root and verify
        env:
          SETUP_ROOT: ${{ runner.temp }}/ws-${{ matrix.tool }}
        run: bash tests/tool-setup.sh "${{ matrix.flag }}" "${{ matrix.label }}"
